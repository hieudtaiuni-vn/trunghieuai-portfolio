<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1e33" />
      <stop offset="50%" stop-color="#142b49" />
      <stop offset="100%" stop-color="#1a3b63" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d4e6f9" />
    </linearGradient>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3978b8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="ogShadow">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBg)"/>

  <!-- Subtle tech grid/rings -->
  <g opacity="0.12" stroke="#60a5fa" stroke-width="1.5" fill="none">
    <circle cx="1020" cy="315" r="320"/>
    <circle cx="1020" cy="315" r="220" stroke-dasharray="8 8"/>
    <circle cx="1020" cy="315" r="120"/>
  </g>

  <!-- Eyebrow Pill -->
  <g transform="translate(100, 110)">
    <rect width="360" height="38" rx="19" fill="rgba(57, 120, 184, 0.25)" stroke="#3978b8" stroke-width="1.5"/>
    <text x="180" y="24" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" fill="#93c5fd" text-anchor="middle" letter-spacing="2.5">OFFICIAL PORTFOLIO · 2026</text>
  </g>

  <!-- Title -->
  <text x="100" y="230" font-family="Inter, system-ui, sans-serif" font-size="68" font-weight="900" fill="url(#textGrad)" letter-spacing="-1.5">DƯƠNG TRUNG HIẾU</text>

  <!-- Subtitle -->
  <text x="100" y="295" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700" fill="url(#blueG)" letter-spacing="4">AI · TECHNOLOGY · INNOVATION</text>

  <!-- Slogan -->
  <text x="100" y="375" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="500" fill="#e2ebf5">Kiến tạo giá trị mới bằng AI và công nghệ.</text>
  <text x="100" y="420" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="400" fill="#94a3b8">Đào tạo & Ứng dụng AI · Tự động hóa · Chuyển đổi số · Nền tảng quản trị</text>

  <!-- Badges / Domain Footer -->
  <g transform="translate(100, 490)">
    <rect width="250" height="48" rx="12" fill="#ffffff" filter="url(#ogShadow)"/>
    <text x="125" y="30" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="800" fill="#142b49" text-anchor="middle">trunghieuai.io.vn ↗</text>
  </g>

  <!-- Right side graphic card -->
  <g transform="translate(850, 175)" filter="url(#ogShadow)">
    <rect width="260" height="280" rx="24" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5"/>
    <circle cx="130" cy="110" r="60" fill="url(#blueG)"/>
    <text x="130" y="125" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">DTH</text>
    <text x="130" y="210" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">CHUYÊN GIA AI</text>
    <text x="130" y="235" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#93c5fd" text-anchor="middle">&amp; QUẢN TRỊ</text>
  </g>
</svg>