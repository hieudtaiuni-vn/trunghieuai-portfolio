<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf2fa" />
      <stop offset="50%" stop-color="#f5f8fb" />
      <stop offset="100%" stop-color="#d9e7f5" />
    </linearGradient>
    <linearGradient id="accentG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3978b8" />
      <stop offset="100%" stop-color="#142b49" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#142b49" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="680" rx="32" fill="url(#bgGrad)" />

  <!-- Tech Geometric Aesthetic -->
  <circle cx="300" cy="270" r="190" fill="none" stroke="#3978b8" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.4" />
  <circle cx="300" cy="270" r="145" fill="none" stroke="#142b49" stroke-width="1" opacity="0.25" />
  <circle cx="300" cy="270" r="230" fill="none" stroke="#3978b8" stroke-width="1" opacity="0.15" />

  <!-- Orbit nodes -->
  <circle cx="165" cy="210" r="5" fill="#3978b8" opacity="0.6"/>
  <circle cx="435" cy="330" r="6" fill="#3978b8" opacity="0.6"/>
  <circle cx="300" cy="80" r="4" fill="#142b49" opacity="0.5"/>

  <!-- Center Card Badge -->
  <g filter="url(#softGlow)">
    <circle cx="300" cy="260" r="105" fill="#ffffff" stroke="rgba(255,255,255,0.9)" stroke-width="8"/>
    <circle cx="300" cy="260" r="95" fill="url(#accentG)"/>
  </g>

  <!-- Stylized Icon Silhouette / Monogram -->
  <path d="M260 295 C260 250, 340 250, 340 295 Z" fill="#ffffff" opacity="0.95"/>
  <circle cx="300" cy="225" r="28" fill="#ffffff" opacity="0.95"/>

  <!-- Tech Badging & Monogram -->
  <text x="300" y="420" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#142b49" text-anchor="middle" letter-spacing="1">DƯƠNG TRUNG HIẾU</text>
  <text x="300" y="448" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#5a6a7e" text-anchor="middle" letter-spacing="3">AI · TECHNOLOGY · INNOVATION</text>

  <!-- Placeholder Instruction Box -->
  <rect x="120" y="490" width="360" height="74" rx="16" fill="#ffffff" stroke="#e2ebf4" stroke-width="1.5" filter="url(#softGlow)" />
  <circle cx="150" cy="527" r="12" fill="#eaf2fa"/>
  <text x="150" y="532" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#3978b8" text-anchor="middle">📷</text>
  <text x="175" y="522" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#142b49">ẢNH CHÂN DUNG CHÍNH THỨC</text>
  <text x="175" y="542" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#667589">Thay thế file: public/images/portrait.jpg</text>

  <!-- Corner watermark -->
  <text x="300" y="630" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#718296" text-anchor="middle" letter-spacing="1.5">OFFICIAL PORTFOLIO · trunghieuai.io.vn</text>
</svg>